<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>totui board</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/kanban.css" />
    <script src="/kanban.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" id="tasks-link" href="/"
        ><span class="brand-mark">[✓]</span>totui</a
      ><span id="connection" role="status">Connecting</span>
      <nav class="pages" aria-label="Pages">
        <a id="tasks-page-link" href="/">Tasks</a
        ><a href="/kanban" aria-current="page">Board</a>
      </nav>
      <div class="top-actions">
        <button id="refresh" aria-label="Refresh board" title="Refresh board">
          ↻
        </button>
      </div>
    </header>
    <main class="kanban-workspace">
      <div class="board-heading">
        <h1 id="heading">Board</h1>
        <p id="summary">Loading</p>
        <div class="board-tools">
          <label class="project-pick"
            ><span>Project</span
            ><select id="project"></select></label
          ><button id="create" class="textlink" disabled>Create board</button>
        </div>
      </div>
      <p id="error" role="alert" hidden></p>
      <div id="columns" class="kanban-columns" aria-label="Kanban board"></div>
      <div id="backlog" class="kanban-backlog"></div>
      <details id="completed" class="kanban-archive" hidden>
        <summary id="completed-summary">Completed (0)</summary>
        <div id="completed-tickets"></div>
      </details>
      <details id="trash" class="kanban-trash" hidden>
        <summary id="trash-summary">Trash</summary>
        <div id="trash-tickets"></div>
      </details>
    </main>
    <dialog id="editor" aria-labelledby="editor-heading">
      <form id="ticket-form">
        <div class="editor-heading">
          <h2 id="editor-heading">Ticket</h2>
          <button type="button" id="close" aria-label="Close ticket">
            esc ✕
          </button>
        </div>
        <p id="stale" role="alert" hidden>
          This ticket changed. Your draft is preserved. Read the latest ticket
          before saving.
          <button type="button" id="reload-ticket" class="textlink">
            Load latest ticket
          </button>
        </p>
        <p id="form-error" role="alert" hidden></p>
        <div id="board-fields">
          <label
            ><span>Board name</span><input id="board-name" maxlength="200"
          /></label>
        </div>
        <div id="ticket-fields">
          <label><span>Title</span><input id="title" maxlength="1000" /></label
          ><label
            ><span>Description</span
            ><textarea
              id="description"
              class="ed-desc"
              rows="3"
            ></textarea></label
          ><label
            ><span>Assignee</span
            ><input id="assignee" maxlength="200" placeholder="Agent or person"
          /></label>
        </div>
        <div class="save-bar">
          <button id="save" class="primary" type="submit">Save</button>
        </div>
      </form>
      <section id="ticket-actions">
        <div class="ticket-shortcuts">
          <button id="to-board" type="button" class="textlink">To board</button
          ><button id="archive-ticket" type="button" class="textlink">
            Archive</button
          ><button id="trash-ticket" type="button" class="danger">Trash</button>
        </div>
        <p id="feedback"></p>
        <div class="move-controls">
          <label
            ><span>Column</span
            ><select id="status"></select></label
          ><label
            ><span>Reason</span
            ><textarea
              id="reason"
              rows="2"
              placeholder="Required when moving back"
            ></textarea></label
          ><button id="move" type="button">Move ticket</button>
        </div>
        <label
          ><span>Add comment</span
          ><textarea id="comment" rows="2"></textarea></label
        ><button id="add-comment" type="button">Add comment</button>
        <div id="resolution-fields">
          <label
            ><span>How was the feedback addressed?</span
            ><textarea id="resolution" rows="2"></textarea></label
          ><button id="resolve" type="button">Record resolution</button>
        </div>
        <h3>Activity</h3>
        <ol id="activity"></ol>
      </section>
    </dialog>
  </body>
</html>
