server {
    listen 80;
    listen [::]:80;
    server_name totui.gimmi.is;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/totui-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://totui.gimmi.is$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name totui.gimmi.is;

    ssl_certificate /etc/letsencrypt/live/totui.gimmi.is/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/totui.gimmi.is/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Auth-Request-Redirect $scheme://$host$request_uri;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass http://127.0.0.1:4180;
        include /etc/nginx/proxy_params;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    location /api/ {
        auth_request /oauth2/auth;
        auth_request_set $totui_api_auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $totui_api_auth_cookie always;
        add_header X-Content-Type-Options nosniff always;

        proxy_pass http://127.0.0.1:48372;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        auth_request_set $totui_auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $totui_auth_cookie always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;

        proxy_pass http://127.0.0.1:48372;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
